# Build the Astro site and deploy it to Hostinger over FTPS.
#
#  push to main (incl. every CMS save) → staging, and production once PRODUCTION_LIVE=true
#  daily 00:05 IST                      → rebuild so past departures drop off
#  manual run                           → choose staging or production
#
# Repository settings → Secrets and variables → Actions:
#   secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   vars:    STAGING_URL (e.g. https://staging.hyderabadcampersclubhcc.in)
#            STAGING_DIR (Hostinger: "staging/"; FTP logins start inside public_html)
#            PRODUCTION_DIR (Hostinger: "./" = public_html itself)
#            PRODUCTION_LIVE ("true" only after the go-live cutover)
#            CMS_REPO (owner/repo of this repository)
#            FTP_PROTOCOL (optional: ftps by default; set to ftp if the server refuses TLS)
# Production only deploys when run manually with target=production, or automatically once
# PRODUCTION_LIVE=true (go-live). Restrict the "production" environment to the main branch.
name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '35 18 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (noindex)
        run: npm run build
        env:
          SITE_URL: ${{ vars.STAGING_URL }}
          PUBLIC_CMS_REPO: ${{ vars.CMS_REPO }}
          PUBLIC_SHOW_SAMPLES: ${{ vars.STAGING_SHOW_SAMPLES }}
          PUBLIC_ENABLE_TRACKING: ${{ vars.STAGING_ENABLE_TRACKING }}
      - name: Normalise FTP login
        id: ftp
        # Tolerates copy-paste noise: "ftp://" prefixes, ":21", spaces and line breaks around the
        # host/username, and a trailing line break on the password.
        run: |
          host=$(printf '%s' "$RAW_HOST" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          user=$(printf '%s' "$RAW_USER" | tr -d '[:space:]')
          pass=$(printf '%s' "$RAW_PASS" | tr -d '\r\n')
          for v in host user pass; do
            if [ -z "${!v}" ]; then echo "::error::FTP secret for $v is empty"; exit 1; fi
          done
          echo "::add-mask::$host"; echo "::add-mask::$user"; echo "::add-mask::$pass"
          { echo "host=$host"; echo "user=$user"; echo "pass=$pass"; } >> "$GITHUB_OUTPUT"
          # Staging folder with exactly one trailing slash, so "<dir>trips/" is always a valid path.
          dir="${STAGING_DIR%/}/"; echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "FTP login prepared (user length ${#user}, password length ${#pass})"
        env:
          RAW_HOST: ${{ secrets.FTP_SERVER }}
          RAW_USER: ${{ secrets.FTP_USERNAME }}
          RAW_PASS: ${{ secrets.FTP_PASSWORD }}
          STAGING_DIR: ${{ vars.STAGING_DIR }}
      # The upload is split in two parts, each with its own sync state (Oct 2026): a single long
      # upload kept stopping after ~6 minutes at the same point, and FTP-Deploy-Action saves its
      # state only when a run completes, so every retry restarted from scratch. A part that
      # finishes now stays done; a part that drops is retried once. Excluded paths are also
      # filtered from the server state, so part 1 never deletes the trip pages.
      # Before every upload attempt, remove temp files left by an interrupted upload (tools/ftp-cleanup.sh).
      - name: Remove leftover upload temp files (before part 1)
        run: bash tools/ftp-cleanup.sh
        env:
          FTP_HOST: ${{ steps.ftp.outputs.host }}
          FTP_USER: ${{ steps.ftp.outputs.user }}
          LFTP_PASSWORD: ${{ steps.ftp.outputs.pass }}
          FTP_DIR: ${{ steps.ftp.outputs.dir }}
      # Part 1: everything except /trips/ (assets first, then pages), same state file as before.
      - name: Deploy to Hostinger (staging, part 1 of 2)
        id: part1
        continue-on-error: true
        timeout-minutes: 20
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ steps.ftp.outputs.user }}
          password: ${{ steps.ftp.outputs.pass }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          # 2 min instead of the 30 s default: the control connection sits idle while a large file uploads
          # (runs failed with 'Timeout (control socket)').
          timeout: 120000
          local-dir: ./dist/
          server-dir: ${{ steps.ftp.outputs.dir }}
          # Fresh sync state (Oct 2026): the old .ftp-deploy-sync-state.json still listed the removed
          # /camping/ folder, so every run failed with "550 /staging/camping" before saving its state.
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            api/config.php
            trips/**
            # Retired page still listed in the sync state; excluding it stops the failing delete of a
            # folder that no longer exists ("550 /staging/destinations/narsapur").
            destinations/narsapur
            destinations/narsapur/**
      - name: Remove leftover upload temp files before retrying part 1
        if: steps.part1.outcome == 'failure'
        run: bash tools/ftp-cleanup.sh
        env:
          FTP_HOST: ${{ steps.ftp.outputs.host }}
          FTP_USER: ${{ steps.ftp.outputs.user }}
          LFTP_PASSWORD: ${{ steps.ftp.outputs.pass }}
          FTP_DIR: ${{ steps.ftp.outputs.dir }}
      - name: Retry part 1
        if: steps.part1.outcome == 'failure'
        timeout-minutes: 20
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ steps.ftp.outputs.user }}
          password: ${{ steps.ftp.outputs.pass }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          # 2 min instead of the 30 s default: the control connection sits idle while a large file uploads
          # (runs failed with 'Timeout (control socket)').
          timeout: 120000
          local-dir: ./dist/
          server-dir: ${{ steps.ftp.outputs.dir }}
          # Fresh sync state (Oct 2026): the old .ftp-deploy-sync-state.json still listed the removed
          # /camping/ folder, so every run failed with "550 /staging/camping" before saving its state.
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            api/config.php
            trips/**
            # Retired page still listed in the sync state; excluding it stops the failing delete of a
            # folder that no longer exists ("550 /staging/destinations/narsapur").
            destinations/narsapur
            destinations/narsapur/**
      - name: Remove leftover upload temp files (before part 2)
        run: bash tools/ftp-cleanup.sh
        env:
          FTP_HOST: ${{ steps.ftp.outputs.host }}
          FTP_USER: ${{ steps.ftp.outputs.user }}
          LFTP_PASSWORD: ${{ steps.ftp.outputs.pass }}
          FTP_DIR: ${{ steps.ftp.outputs.dir }}
      # Part 2: the trip pages, with their own sync state inside /trips/.
      - name: Deploy to Hostinger (staging, part 2 of 2)
        id: part2
        continue-on-error: true
        timeout-minutes: 20
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ steps.ftp.outputs.user }}
          password: ${{ steps.ftp.outputs.pass }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          # 2 min instead of the 30 s default: the control connection sits idle while a large file uploads
          # (runs failed with 'Timeout (control socket)').
          timeout: 120000
          local-dir: ./dist/trips/
          server-dir: ${{ steps.ftp.outputs.dir }}trips/
          state-name: .ftp-deploy-sync-state-trips.json
      - name: Remove leftover upload temp files before retrying part 2
        if: steps.part2.outcome == 'failure'
        run: bash tools/ftp-cleanup.sh
        env:
          FTP_HOST: ${{ steps.ftp.outputs.host }}
          FTP_USER: ${{ steps.ftp.outputs.user }}
          LFTP_PASSWORD: ${{ steps.ftp.outputs.pass }}
          FTP_DIR: ${{ steps.ftp.outputs.dir }}
      - name: Retry part 2
        if: steps.part2.outcome == 'failure'
        timeout-minutes: 20
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ steps.ftp.outputs.user }}
          password: ${{ steps.ftp.outputs.pass }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          # 2 min instead of the 30 s default: the control connection sits idle while a large file uploads
          # (runs failed with 'Timeout (control socket)').
          timeout: 120000
          local-dir: ./dist/trips/
          server-dir: ${{ steps.ftp.outputs.dir }}trips/
          state-name: .ftp-deploy-sync-state-trips.json

  production:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target == 'production') ||
      (github.event_name != 'workflow_dispatch' && vars.PRODUCTION_LIVE == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx astro check
      - name: Build (indexable)
        run: npm run build
        env:
          SITE_URL: https://hyderabadcampersclubhcc.in
          PUBLIC_ALLOW_INDEXING: 'true'
          PUBLIC_CMS_REPO: ${{ vars.CMS_REPO }}
      - name: Normalise FTP login
        id: ftp
        # Tolerates copy-paste noise: "ftp://" prefixes, ":21", spaces and line breaks around the
        # host/username, and a trailing line break on the password.
        run: |
          host=$(printf '%s' "$RAW_HOST" | tr -d '[:space:]' | sed -E 's#^[a-zA-Z]+://##; s#/.*$##; s#:[0-9]+$##')
          user=$(printf '%s' "$RAW_USER" | tr -d '[:space:]')
          pass=$(printf '%s' "$RAW_PASS" | tr -d '\r\n')
          for v in host user pass; do
            if [ -z "${!v}" ]; then echo "::error::FTP secret for $v is empty"; exit 1; fi
          done
          echo "::add-mask::$host"; echo "::add-mask::$user"; echo "::add-mask::$pass"
          { echo "host=$host"; echo "user=$user"; echo "pass=$pass"; } >> "$GITHUB_OUTPUT"
          echo "FTP login prepared (user length ${#user}, password length ${#pass})"
        env:
          RAW_HOST: ${{ secrets.FTP_SERVER }}
          RAW_USER: ${{ secrets.FTP_USERNAME }}
          RAW_PASS: ${{ secrets.FTP_PASSWORD }}
      - name: Deploy to Hostinger (production)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ steps.ftp.outputs.user }}
          password: ${{ steps.ftp.outputs.pass }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ vars.PRODUCTION_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            api/config.php

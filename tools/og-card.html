<!doctype html>
<!--
  Source for public/og-default.png (the share image for pages without their own photo).
  Regenerate:  node tools/make-og.mjs
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../src/assets/fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Inter';
        src: url('../src/assets/fonts/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .card {
        position: relative;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #0a241c;
        color: #fff;
        font-family: 'Inter', sans-serif;
      }
      .topo {
        position: absolute;
        inset: 0;
        opacity: 0.16;
      }
      .brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .badge {
        display: block;
        width: 120px;
        height: 120px;
        border-radius: 50%;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border-radius: 18px;
        background: #17543f;
      }
      .brand b {
        display: block;
        font: 800 34px/1 'Bricolage', sans-serif;
        letter-spacing: -0.01em;
      }
      .brand span {
        display: block;
        margin-top: 8px;
        font-size: 17px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgb(255 255 255 / 0.7);
      }
      h1 {
        position: relative;
        margin: 0;
        max-width: 900px;
        font: 800 76px/1.02 'Bricolage', sans-serif;
        letter-spacing: -0.025em;
      }
      h1 em {
        font-style: normal;
        color: #f2a61d;
      }
      .foot {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 26px;
        color: rgb(255 255 255 / 0.82);
      }
      .foot i {
        width: 56px;
        height: 4px;
        border-radius: 2px;
        background: #f2a61d;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="topo" viewBox="0 0 1200 630" preserveAspectRatio="none" aria-hidden="true">
        <g fill="none" stroke="#fff" stroke-width="1.5">
          <path d="M700 630c40-120 160-170 260-150s160-60 240-120" />
          <path d="M760 630c30-90 130-130 210-115s150-50 230-100" />
          <path d="M820 630c25-60 100-90 160-80s140-40 220-80" />
          <path d="M640 630c50-150 190-210 310-190s170-80 250-150" />
          <path d="M580 630c60-180 220-250 360-230s180-100 260-180" />
          <path d="M900 0c-20 80 30 140 110 150s140 60 190 110" />
          <path d="M980 0c-10 50 20 90 80 100s110 40 140 70" />
        </g>
      </svg>
      <div class="brand">
        <img class="badge" src="../public/hcc-logo.png" width="120" height="120" alt="Hyderabad Campers Club (HCC) logo" />
      </div>
      <h1>Group trips, treks &amp; weekend getaways <em>from Hyderabad</em></h1>
      <p class="foot"><i></i>hyderabadcampersclubhcc.in</p>
    </div>
  </body>
</html>
